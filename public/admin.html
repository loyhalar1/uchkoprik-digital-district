<!doctype html>
<html lang="uz" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Uchko‘prik Digital District — Admin</title><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/css/admin.css"></head>
<body>
<section id="loginScreen" class="login-screen"><form id="loginForm" class="login-card glass"><img src="/logo.svg" alt="" width="48" height="48"><span class="eyebrow">UCHKO‘PRIK DIGITAL DISTRICT</span><h1>Admin panel</h1><p>Supabase Auth orqali xavfsiz kirish.</p><label>Email<input id="adminEmail" type="email" autocomplete="username" required placeholder="admin@example.uz"></label><label>Parol<input id="adminPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Kirish</button><div id="loginError" class="error hidden"></div></form></section>
<div id="adminApp" class="admin-app hidden"><aside class="sidebar glass"><a class="admin-brand" href="/uz" target="_blank"><img src="/logo.svg" alt=""><span><strong>UCHKO‘PRIK</strong><small>Digital District</small></span></a><nav id="adminNav"><button class="nav-item active" data-view="dashboard">Dashboard</button><button class="nav-item" data-view="mahallas">MFYlar</button><button class="nav-item" data-view="organizations">Tashkilotlar</button><button class="nav-item" data-view="categories">Kategoriyalar</button><button class="nav-item" data-view="economicZones">Iqtisodiy zonalar</button><button class="nav-item" data-view="district">Tuman pasporti</button></nav><div class="sidebar-foot"><span id="adminIdentity">—</span><a href="/uz" target="_blank">Public platforma</a><button id="logoutBtn">Chiqish</button></div></aside>
<main class="content"><header class="admin-topbar glass"><div><span id="viewEyebrow" class="eyebrow">SYSTEM</span><h1 id="viewTitle">Dashboard</h1></div><div class="top-actions"><button id="refreshBtn" class="secondary">Yangilash</button><button id="addBtn" class="primary hidden">+ Yangi</button></div></header>
<section id="dashboardView" class="view"><div id="metricGrid" class="metric-grid"></div><div class="dashboard-grid"><section class="panel glass"><div class="panel-head"><h2>Ma’lumot holati</h2></div><div id="coverageList" class="coverage-list"></div></section><section class="panel glass"><div class="panel-head"><h2>Tuman pasporti</h2></div><div id="districtPreview" class="district-preview"></div></section></div></section>
<section id="tableView" class="view hidden"><div class="table-toolbar glass"><input id="tableSearch" type="search" placeholder="Nom, slug, JSHIR/INN yoki tur bo‘yicha qidirish…"><div id="tableCount"></div></div><div class="table-wrap glass"><table><thead id="dataHead"></thead><tbody id="dataBody"></tbody></table></div></section>
<section id="districtView" class="view hidden"><form id="districtForm" class="district-form panel glass"><div class="panel-head"><h2>Tuman ko‘rsatkichlari</h2><button class="primary" type="submit">Saqlash</button></div><div id="districtFields" class="editor-fields"></div></form></section>
</main></div>
<section id="editorBackdrop" class="modal-backdrop hidden"><form id="editorForm" class="editor glass"><div class="editor-head"><div><span class="eyebrow">DATA EDITOR</span><h2 id="editorTitle">Yozuv</h2></div><button id="editorClose" type="button" class="icon-btn">×</button></div><div id="editorFields" class="editor-fields"></div><div class="editor-actions"><button id="deleteBtn" type="button" class="danger hidden">O‘chirish</button><span></span><button id="cancelBtn" type="button" class="secondary">Bekor qilish</button><button type="submit" class="primary">Saqlash</button></div></form></section>
<div id="toastHost" class="toast-host"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/supabase.js"></script><script type="module" src="/assets/js/admin.js"></script></body></html>
